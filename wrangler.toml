# Cloudflare Pages configuration for Next Step.
# The static site is in ./public, the chat backend is in ./functions/api/chat.js.
name = "next-step"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

# Free AI binding (10,000 Neurons per day at no charge on the Workers Free plan).
[ai]
binding = "AI"

# Cookie-free counts (landing visits, Desk opens, copied or emailed letters, downloaded PDFs).
# OFF until Analytics Engine is switched on for the Cloudflare account: with it off, Cloudflare refuses to deploy a project
# that names a dataset. The site works without it (the counting call is simply ignored).
# To turn on: Cloudflare dashboard > Workers & Pages > Analytics Engine > enable, then remove the "# " from the three lines
# below, commit and push. Details: "Hand-over" in docs/DESIGN.md.
# [[analytics_engine_datasets]]
# binding = "COUNTS"
# dataset = "next_step_counts"
